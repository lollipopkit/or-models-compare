<!DOCTYPE html>
<html lang="en" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Models Compare</title>
    <script src="./i18n.js"></script>
    <script src="./particles.js"></script>
    <style>
        :root {
            --bg: #fdf2f8;
            --card: #ffffff;
            --border: #00000000;
            --text: #334155;
            --muted: #64748b;
            --accent: #ec4899;
            --accent-strong: #8b5cf6;
            --pill: #f1f5f9;
            --soft: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        .app-shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 20px 40px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .brand p {
            color: var(--muted);
            font-size: 14px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--pill);
            border-radius: 999px;
            color: var(--muted);
            font-size: 13px;
        }

        .meta-chip strong {
            color: var(--text);
            font-weight: 700;
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .github-button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #f6f8fa;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #656d76;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            text-decoration: none;
            padding: 0;
            border: 1px solid #d0d7de;
        }

        .github-button:hover {
            background-color: #f3f4f6;
            color: #24292f;
        }

        .github-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .lang-switch {
            position: relative;
        }

        .icon-button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #f6f8fa;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #656d76;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            padding: 0;
            border: 1px solid #d0d7de;
        }

        .icon-button:hover {
            background-color: #f3f4f6;
            color: #24292f;
        }

        .lang-menu {
            position: absolute;
            top: 46px;
            right: 0;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            min-width: 180px;
            padding: 6px;
            display: none;
            z-index: 25;
        }

        .lang-menu.open {
            display: block;
        }

        .lang-option {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            background: transparent;
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .lang-option:hover,
        .lang-option.active {
            background: #eef2ff;
            color: var(--accent-strong);
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            line-height: 1.2;
            min-height: 32px; /* 与header-toggle按钮高度一致 */
        }

        .panel-subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .column-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px 12px;
        }

        .column-option {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .compare-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .compare-button {
            padding: 6px 12px;
            border-radius: 6px;
            background: #238636;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            min-height: 28px;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            line-height: 1.25;
            touch-action: manipulation; /* 改善触控响应 */
            border: 1px solid transparent;
        }

        .compare-button:hover:not(:disabled) {
            background-color: #2ea043;
        }

        .compare-button:active:not(:disabled) {
            background-color: #238636;
        }

        .compare-button:disabled {
            background-color: #94d3a2;
            color: rgba(255, 255, 255, 0.8);
            cursor: not-allowed;
        }

        .clear-button {
            padding: 6px 12px;
            border-radius: 6px;
            background: #f6f8fa;
            color: #24292f;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            min-height: 28px;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            line-height: 1.25;
            touch-action: manipulation;
            border: 1px solid #d0d7de;
        }

        .clear-button:hover:not(:disabled) {
            background-color: #f3f4f6;
        }

        .clear-button:active:not(:disabled) {
            background-color: #f6f8fa;
        }

        .clear-button:disabled {
            background-color: #f6f8fa;
            color: #8c959f;
            cursor: not-allowed;
        }

        .compare-mode-active {
            background: #eef2ff;
            color: var(--accent-strong);
        }

        .workspace {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 16px;
            align-items: start;
            margin-top: 16px;
        }

        .filters-pane {
            position: sticky;
            top: 86px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .controls {
            padding: 0;
        }

        .controls-body {
            padding: 8px 14px 12px;
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.25s ease;
        }

        .collapsed .controls-body {
            padding: 0 14px 0;
        }

        .controls .card-header {
            align-items: center;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .header-toggle,
        #filtersToggle {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #f6f8fa;
            cursor: pointer;
            color: #656d76;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease;
            min-width: 28px;
            min-height: 28px;
            border: 1px solid #d0d7de;
        }

        .chevron-icon {
            transition: transform 0.25s ease;
            width: 16px;
            height: 16px;
        }

        .chevron-icon.chevron-right {
            transform: rotate(-90deg);
        }

        .chevron-icon:not(.chevron-right) {
            transform: rotate(0deg);
        }

        .header-toggle:hover,
        #filtersToggle:hover {
            background-color: #f3f4f6;
            color: #24292f;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }

        .filter-group select {
            padding: 8px 32px 8px 12px;
            border-radius: 13px;
            background-color: #ffffff;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23657676' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            line-height: 20px;
            color: #24292f;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #d0d7de;
            min-height: 32px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .search-box input {
            padding: 8px 12px;
            border-radius: 13px;
            background: #ffffff;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            line-height: 20px;
            color: #24292f;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #d0d7de;
            min-height: 32px;
        }

        .search-box {
            position: relative;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--card);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            z-index: 10;
            max-height: 320px;
            overflow: auto;
            display: none;
        }

        .search-results-topbar {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: min(600px, calc(100vw - 40px));
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            z-index: 100;
            max-height: 400px;
            overflow: auto;
            display: none;
        }

        @media (max-width: 768px) {
            .search-results-topbar {
                top: 70px;
                width: calc(100vw - 20px);
                max-width: none;
            }

            .app-shell {
                padding: 16px 12px 30px;
                max-width: none;
                width: 100%;
            }

            .topbar {
                padding: 12px 14px;
            }

            .filters-pane {
                gap: 6px;
            }

            .card {
                padding: 14px;
            }

            .controls-body {
                padding: 10px 14px 14px;
            }

            .table-card {
                margin: 0;
                width: 100%;
            }

            .table-container {
                margin: 0;
                width: 100%;
            }
        }

        @media (min-width: 769px) {
            .controls .card-header {
                padding: 10px 14px;
                margin-bottom: 0;
                line-height: 1.2;
            }
        }

        .search-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            min-height: 40px;
        }

        .search-result-name {
            font-weight: 600;
            color: var(--text);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .filter-group select:focus,
        .search-box input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
        }

        .content-pane {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
        }

        .table-card {
            padding: 0;
        }

        select:focus,
        .search-box input:focus {
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
        }

        .table-toolbar {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .table-container {
            background: var(--card);
            border-radius: 0 0 14px 14px;
            overflow: hidden;
            min-width: 0;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            position: relative;
        }

        .table-wrapper::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.1));
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .table-wrapper.scrollable::after {
            opacity: 1;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: var(--soft);
            border-radius: 3px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--muted);
            border-radius: 3px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            table-layout: auto;
            min-width: 800px;
        }

        th {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(139, 92, 246, 0.1));
            padding: 14px 12px;
            text-align: left;
            font-weight: 700;
            font-size: 13px;
            color: #6d28d9;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        th:first-child {
            border-top-left-radius: 14px;
        }

        th:last-child {
            border-top-right-radius: 14px;
        }

        th:hover {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(139, 92, 246, 0.2));
        }

        th.sortable::after {
            content: ' ↕';
            color: #94a3b8;
            font-size: 12px;
        }

        th.sort-asc::after {
            content: ' ↑';
            color: var(--accent);
        }

        th.sort-desc::after {
            content: ' ↓';
            color: var(--accent);
        }

        td {
            padding: 12px;
            font-size: 14px;
            vertical-align: middle;
        }

        .cell-text,
        .cell-html {
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            white-space: normal;
        }

        .cell-html {
            line-height: 1.4;
        }

        tr:hover {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.05), rgba(139, 92, 246, 0.05));
            cursor: pointer;
        }

        .model-name {
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .model-description {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--muted);
        }

        .price {
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            color: #059669;
        }

        .context-length {
            font-weight: 600;
            color: #7c3aed;
        }

        .provider-info {
            font-size: 13px;
        }

        .moderated {
            display: inline-block;
            padding: 2px 6px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 6px;
            font-size: 11px;
            margin-left: 6px;
        }

        .selected-row {
            background: #eef2ff;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .filters-pane {
                position: static;
            }

            .content-pane {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .topbar-actions {
                flex-wrap: wrap;
                justify-content: stretch;
                gap: 8px;
            }

            .topbar-actions .search-box {
                order: -1;
                max-width: none;
                width: 100%;
            }

            .meta-chip {
                flex: 1;
                min-width: 0;
            }

            .actions-group {
                flex-shrink: 0;
            }

            .table-toolbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .app-shell {
                padding: 12px 8px 20px;
                max-width: none;
                width: 100%;
            }

            .table-card {
                margin: 0;
                width: 100%;
                border-radius: 12px;
            }

            .table-container {
                margin: 0;
                width: 100%;
            }

            .content-pane {
                gap: 8px;
            }

            .topbar {
                padding: 10px 12px;
                gap: 10px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .meta-chip {
                font-size: 12px;
                padding: 6px 10px;
            }

            .card {
                padding: 12px;
                border-radius: 12px;
            }

            .controls-body {
                padding: 8px 12px 12px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .filter-group select {
                padding: 8px 28px 8px 10px;
                font-size: 16px;
            }

            .search-box input {
                padding: 8px 10px;
                font-size: 16px;
            }

            .github-button,
            .icon-button {
                width: 40px;
                height: 40px;
            }

            .header-toggle,
            #filtersToggle {
                width: 32px;
                height: 32px;
                min-width: 32px;
                min-height: 32px;
            }

            .column-options {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 8px 10px;
            }

            .column-option {
                font-size: 12px;
            }

            .table-wrapper {
                border-radius: 0 0 12px 12px;
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x proximity;
            }

            tr {
                scroll-snap-align: start;
            }

            .table-container {
                transform: translateZ(0);
                -webkit-transform: translateZ(0);
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 13px;
            }

            .model-name {
                font-size: 14px;
            }

            .price {
                font-size: 12px;
            }

            .context-length {
                font-size: 12px;
            }

            .provider-info {
                font-size: 12px;
            }

            .cell-text,
            .cell-html {
                -webkit-line-clamp: 3;
                line-clamp: 3;
            }
        }

        @media (max-width: 360px) {
            .app-shell {
                padding: 8px 4px 16px;
                max-width: none;
                width: 100%;
            }

            .table-card {
                margin: 0;
                width: 100%;
                border-radius: 12px;
            }

            .table-container {
                margin: 0;
                width: 100%;
            }

            .content-pane {
                gap: 6px;
            }

            .filters-pane {
                gap: 2px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .column-options {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .column-option {
                font-size: 11px;
            }

            .card {
                padding: 8px;
            }

            .controls-body {
                padding: 6px 8px 8px;
            }

            .collapsed .controls-body {
                padding: 0 8px 0;
            }

            th,
            td {
                padding: 8px 6px;
                font-size: 12px;
            }

            .model-name {
                font-size: 13px;
            }

            .price,
            .context-length,
            .provider-info {
                font-size: 11px;
            }

            .meta-chip {
                font-size: 11px;
                padding: 4px 8px;
            }

            .compare-button,
            .clear-button {
                padding: 6px 12px;
                font-size: 12px;
                min-height: 28px;
            }

            .search-result-item {
                padding: 8px 10px;
            }

            .cell-text,
            .cell-html {
                -webkit-line-clamp: 2;
                line-clamp: 2;
                font-size: 11px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a0d1f;
                --card: #1e293b;
                --border: #475569;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --pill: #334155;
                --soft: #334155;
            }

            body {
                position: relative;
            }

            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(ellipse at center,
                    rgba(30, 41, 59, 0.3) 0%,
                    rgba(15, 23, 42, 0.5) 100%);
                pointer-events: none;
                z-index: -2;
            }

            body {
                background: var(--bg);
                color: var(--text);
            }

            .filter-group select {
                background-color: #0d1117;
                color: #f0f6fc;
                border-color: #30363d;
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 8px center;
                background-size: 16px;
            }

            .search-box input {
                background: #0d1117;
                color: #f0f6fc;
                border-color: #30363d;
            }

            .filter-group select:focus,
            .search-box input:focus {
                border-color: #1f6feb;
                box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
            }

            select option,
            .lang-menu,
            .lang-option {
                background: #334155;
                color: var(--text);
            }

            th {
                background: linear-gradient(135deg, rgba(244, 114, 182, 0.2), rgba(196, 132, 252, 0.2));
                color: #c084fc;
            }

            th:first-child {
                border-top-left-radius: 14px;
            }

            th:last-child {
                border-top-right-radius: 14px;
            }

            tr:hover {
                background: linear-gradient(135deg, rgba(244, 114, 182, 0.1), rgba(196, 132, 252, 0.1));
            }

            .selected-row {
                background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2));
            }

            .meta-chip {
                background: #1e293b;
                color: var(--muted);
            }

            .lang-menu {
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            }

            .price {
                color: #7dd3fc;
            }

            .context-length {
                color: #c4b5fd;
            }

            .provider-info,
            .panel-subtitle,
            .filter-group label,
            .compare-table th {
                color: var(--muted);
            }

            .clear-button {
                background: #21262d;
                color: #c9d1d9;
                border-color: #30363d;
            }

            .clear-button:hover:not(:disabled) {
                background: #30363d;
                color: #f0f6fc;
            }

            .github-button,
            .icon-button {
                background: #21262d;
                color: #8b949e;
                border-color: #30363d;
            }

            .github-button:hover,
            .icon-button:hover {
                background: #30363d;
                color: #c9d1d9;
            }

            .header-toggle,
            #filtersToggle {
                background: #21262d;
                color: #8b949e;
                border-color: #30363d;
            }

            .header-toggle:hover,
            #filtersToggle:hover {
                background: #30363d;
                color: #c9d1d9;
            }

            .json-content {
                background: #334155;
            }

            .loading {
                color: #94a3b8;
            }

            .search-results-topbar {
                background: #1e293b;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            }

            /* 删除按钮暗色模式样式 */
            .delete-button {
                background: #21262d !important;
                border-color: #30363d !important;
                color: #f85149 !important;
            }

            .delete-button:hover {
                background: #2d1a1a !important;
                border-color: #f85149 !important;
            }
        }

        .json-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .json-modal-content {
            background-color: var(--card);
            margin: 5% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .json-modal-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--soft);
        }

        .json-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }

        .json-modal-close {
            background: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            padding: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .json-modal-close:hover {
            background-color: var(--muted);
            color: var(--text);
        }

        .json-modal-body {
            padding: 20px;
            max-height: calc(80vh - 120px);
            overflow-y: auto;
        }

        .json-content {
            background: var(--soft);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Monaco', 'Consolas', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            overflow-x: auto;
        }

        .compare-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }

        .compare-modal-content {
            background: var(--card);
            width: 95%;
            max-width: 1100px;
            margin: 4% auto;
            border-radius: 12px;
            overflow: hidden;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .compare-modal-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .compare-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .compare-modal-body {
            overflow: auto;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
        }

        .compare-table th,
        .compare-table td {
            padding: 12px;
            text-align: left;
            font-size: 13px;
            vertical-align: top;
        }

        .compare-table th {
            background: var(--soft);
            font-weight: 700;
            color: var(--muted);
        }

        .compare-modal-footer {
            padding: 12px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Info Dialog */
        .info-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1001;
        }

        .info-dialog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .info-dialog-content {
            position: relative;
            background: var(--card);
            margin: 20vh auto;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .info-dialog.show .info-dialog-content {
            transform: translateY(0);
            opacity: 1;
        }

        .info-dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--soft);
        }

        .info-dialog-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }

        .info-dialog-close {
            width: 32px;
            height: 32px;
            background: transparent;
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }

        .info-dialog-close:hover {
            background: var(--muted);
            color: var(--text);
        }

        .info-dialog-body {
            padding: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .info-label {
            font-weight: 500;
            color: var(--muted);
            font-size: 14px;
        }

        .info-value {
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            text-align: right;
        }

        .desktop-only {
            display: block;
        }

        .mobile-only {
            display: none;
        }

        .info-button {
            display: none;
        }

        @media (max-width: 640px) {
            .desktop-only {
                display: none !important;
            }

            .mobile-only {
                display: block !important;
            }

            .info-button {
                display: inline-flex !important;
            }

            .info-dialog-content {
                margin: 15vh auto;
                width: 85%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <header class="topbar" id="headerCard">
            <div class="brand">
                <h1 data-i18n="title">OpenRouter Models Compare</h1>
            </div>

                <div class="meta-chip desktop-only" aria-live="polite">

                    <strong id="lastUpdateMeta">-</strong>
                </div>
                <div class="actions-group">
                    <div id="languageMount"></div>
                    <button id="infoButton" class="icon-button info-button" aria-label="信息">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
                        </svg>
                    </button>
                    <a href="https://github.com/lollipopkit/or-models-compare" target="_blank" class="github-button"
                        aria-label="GitHub">
                        <svg class="github-icon" viewBox="0 0 24 24">
                            <path
                                d="M12 0C5.374 0 0 5.373 0 12 0 17.302 3.438 21.8 8.207 23.387c.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z" />
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <div class="workspace">
            <aside class="filters-pane">
                <div class="card controls" id="viewCard">
                    <div class="card-header">

                        <button id="viewToggle" class="header-toggle" aria-expanded="true"

                                <polyline points="6,9 12,15 18,9"></polyline>

                        </button>
                    </div>
                    <div class="controls-body" id="viewBody">
                        <div class="column-options">

                                    data-i18n="model_name">模型名称</span></label>
                            <label class="column-option"><input type="checkbox" id="col-description"><span

                                    data-i18n="price">价格</span></label>
