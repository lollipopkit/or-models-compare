    <script>
        class ModelsManager {
            constructor() {
                this.models = [];
                this.filteredModels = [];
                this.sortColumn = '';
                this.sortDirection = 'asc';
                this.inputModalities = [];
                this.outputModalities = [];
                this.selectedModelIds = new Set();
                this.compareMode = false;
                this.i18n = null;
                this.headerCollapsed = true;

                const isNarrowScreen = window.innerWidth <= 640;
                this.viewCollapsed = isNarrowScreen;
                this.filtersCollapsed = isNarrowScreen;

                this.init();
            }

            init() {
                try {
                    this.i18n = new I18nManager();
                    this.i18n.init();
                } catch (error) {
                    console.warn('Failed to initialize i18n:', error);
                    this.i18n = {
                        t: (key) => key,
                        setLanguage: () => { },
                        currentLanguage: 'zh-CN'
                    };
                }

                // 监听语言变化
                document.addEventListener('languageChanged', () => {
                    this.onLanguageChanged();
                });

                this.loadData();
                this.setupEventListeners();
                setTimeout(() => {
                    this.setupHeaderCollapse();
                    this.setupFiltersCollapse();
                    this.setupViewCollapse();
                    this.setupResponsiveCollapse();
                    this.applyViewState();
                    this.applyFiltersState();
                    this.loadColumnSettings();
                }, 10);
            }

            setupViewCollapse() {
                const card = document.getElementById('viewCard');
                const toggle = document.getElementById('viewToggle');
                const body = document.getElementById('viewBody');
                if (!card || !toggle || !body) return;

                const applyState = () => {
                    const collapsed = this.viewCollapsed;
                    card.classList.toggle('collapsed', collapsed);
                    toggle.setAttribute('aria-expanded', String(!collapsed));
                    const icon = toggle.querySelector('.chevron-icon');
                    if (icon) {
                        icon.classList.toggle('chevron-right', collapsed);
                    }
                    body.style.maxHeight = collapsed ? '0px' : `${body.scrollHeight}px`;
                    body.style.opacity = collapsed ? '0' : '1';
                };

                applyState();

                toggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.viewCollapsed = !this.viewCollapsed;
                    applyState();
                });
            }

            onLanguageChanged() {
                this.renderTable();
                this.renderModalityFilters();
                this.updateSelectOptions();
            }

            updateSelectOptions() {
                if (!this.i18n || typeof this.i18n.t !== 'function') {
                    return;
                }

                const priceFilter = document.getElementById('priceFilter');
                const priceOptions = priceFilter.querySelectorAll('option');
                priceOptions[0].textContent = this.i18n.t('all');
                priceOptions[1].textContent = this.i18n.t('free');
                priceOptions[2].textContent = this.i18n.t('low');
                priceOptions[3].textContent = this.i18n.t('medium');
                priceOptions[4].textContent = this.i18n.t('high');

                const contextFilter = document.getElementById('contextFilter');
                const contextOptions = contextFilter.querySelectorAll('option');
                contextOptions[0].textContent = this.i18n.t('all');
                contextOptions[1].textContent = this.i18n.t('short');
                contextOptions[2].textContent = this.i18n.t('medium_ctx');
                contextOptions[3].textContent = this.i18n.t('long');
                contextOptions[4].textContent = this.i18n.t('extra_long');

                const inputModalityFilter = document.getElementById('inputModalityFilter');
                if (inputModalityFilter?.options.length) {
                    inputModalityFilter.options[0].textContent = this.i18n.t('all');
                }
                const outputModalityFilter = document.getElementById('outputModalityFilter');
                if (outputModalityFilter?.options.length) {
                    outputModalityFilter.options[0].textContent = this.i18n.t('all');
                }
            }

            async loadData() {
                try {
                    const response = await fetch('./models-data.json');
                    if (response.ok) {
                        const data = await response.json();
                        this.models = data.data || [];
                        this.updateLastUpdateTime(data.lastUpdate);
                    } else {
                        await this.fetchFromAPI();
                    }
                    this.filteredModels = [...this.models];
                    this.extractModalityOptions();
                    this.renderModalityFilters();
                    this.renderTable();
                    this.updateStats();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('modelsTable').style.display = 'table';
                } catch (error) {
                    this.showError(error.message);
                }
            }

            async fetchFromAPI() {
                const response = await fetch('https://openrouter.ai/api/v1/models');
                const data = await response.json();
                this.models = data.data || [];
                this.updateLastUpdateTime(new Date().toISOString());
            }

            updateLastUpdateTime(timestamp) {
                const date = new Date(timestamp || Date.now());
                const formatted = date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN');
                const lastUpdateEl = document.getElementById('lastUpdate');
                if (lastUpdateEl) {
                    lastUpdateEl.textContent = formatted;
                }
                const lastUpdateMeta = document.getElementById('lastUpdateMeta');
                if (lastUpdateMeta) {
                    lastUpdateMeta.textContent = formatted;
                }
                const lastUpdateMetaDialog = document.getElementById('lastUpdateMetaDialog');
                if (lastUpdateMetaDialog) {
                    lastUpdateMetaDialog.textContent = formatted;
                }
            }

            setupEventListeners() {
                // 搜索 - 只更新悬浮列表，不影响主表格
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.renderSearchResults(this.getSearchTerm());
                });

                document.addEventListener('click', (e) => {
                    const searchBox = document.querySelector('.search-box');
                    const searchResults = document.getElementById('searchResults');
                    if (!searchBox.contains(e.target) && searchResults.style.display === 'block') {
                        searchResults.style.display = 'none';
                    }
                });

                const infoButton = document.getElementById('infoButton');
                if (infoButton) {
                    infoButton.addEventListener('click', () => {
                        this.showInfoDialog();
                    });
                }

                const infoDialogClose = document.querySelector('.info-dialog-close');
                if (infoDialogClose) {
                    infoDialogClose.addEventListener('click', () => {
                        this.hideInfoDialog();
                    });
                }

                const infoDialog = document.getElementById('infoDialog');
                if (infoDialog) {
                    infoDialog.addEventListener('click', (e) => {
                        if (e.target === infoDialog || e.target.classList.contains('info-dialog-overlay')) {
                            this.hideInfoDialog();
                        }
                    });
                }

                // 过滤器
                document.getElementById('priceFilter').addEventListener('change', () => {
                    this.applyFilters();
                });

                document.getElementById('contextFilter').addEventListener('change', () => {
                    this.applyFilters();
                });

                document.getElementById('inputModalityFilter').addEventListener('change', () => {
                    this.applyFilters();
                });

                document.getElementById('outputModalityFilter').addEventListener('change', () => {
                    this.applyFilters();
                });

                // 排序
                document.querySelectorAll('th.sortable').forEach(th => {
                    th.addEventListener('click', () => {
                        this.sort(th.dataset.column);
                    });
                });

                // 列显示设置
                document.querySelectorAll('.column-option input').forEach(checkbox => {
                    checkbox.addEventListener('change', () => {
                        this.toggleColumn(checkbox.id, checkbox.checked);
                        this.saveColumnSettings();
                    });
                });
            }

            setupHeaderCollapse() {
                const header = document.getElementById('headerCard');
                const toggle = document.getElementById('headerToggle');
                const body = document.getElementById('headerBody');
                if (!header || !toggle) return;

                const applyState = () => {
                    header.classList.toggle('collapsed', this.headerCollapsed);
                    toggle.setAttribute('aria-expanded', String(!this.headerCollapsed));
                    const icon = toggle.querySelector('.chevron-icon');
                    if (icon) {
                        icon.classList.toggle('chevron-right', this.headerCollapsed);
                    }
                    if (body) {
                        body.style.maxHeight = this.headerCollapsed ? '0px' : `${body.scrollHeight}px`;
                        body.style.opacity = this.headerCollapsed ? '0' : '1';
                    }
                };

                applyState();
                toggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.headerCollapsed = !this.headerCollapsed;
                    applyState();
                });
            }

            setupFiltersCollapse() {
                const controls = document.getElementById('controlsCard');
                const toggle = document.getElementById('filtersToggle');
                const body = document.getElementById('filtersBody');
                if (!controls || !toggle || !body) return;

                const applyState = () => {
                    controls.classList.toggle('collapsed', this.filtersCollapsed);
                    toggle.setAttribute('aria-expanded', String(!this.filtersCollapsed));
                    const icon = toggle.querySelector('.chevron-icon');
                    if (icon) {
                        icon.classList.toggle('chevron-right', this.filtersCollapsed);
                    }
                    body.style.maxHeight = this.filtersCollapsed ? '0px' : `${body.scrollHeight}px`;
                    body.style.opacity = this.filtersCollapsed ? '0' : '1';
                };

                applyState();
                toggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.filtersCollapsed = !this.filtersCollapsed;
                    applyState();
                });
            }

            applyFilters() {
                const searchTerm = this.getSearchTerm();
                const priceFilter = document.getElementById('priceFilter').value;
                const contextFilter = document.getElementById('contextFilter').value;
                const inputModalityFilter = document.getElementById('inputModalityFilter').value;
                const outputModalityFilter = document.getElementById('outputModalityFilter').value;

                this.filteredModels = this.models.filter(model => {
                    // 搜索过滤
                    const matchesSearch = !searchTerm ||
                        model.name.toLowerCase().includes(searchTerm) ||
                        (model.description && model.description.toLowerCase().includes(searchTerm));

                    // 价格过滤
                    let matchesPrice = true;
                    if (priceFilter) {
                        const promptPrice = parseFloat(model.pricing?.prompt || 0);
                        const pricePerMillion = promptPrice * 1000000; // 转换为每百万tokens的价格
                        switch (priceFilter) {
                            case 'free':
                                matchesPrice = promptPrice === 0;
                                break;
                            case 'low':
                                matchesPrice = promptPrice > 0 && pricePerMillion < 1;
                                break;
                            case 'medium':
                                matchesPrice = pricePerMillion >= 1 && pricePerMillion <= 10;
                                break;
                            case 'high':
                                matchesPrice = pricePerMillion > 10;
                                break;
                        }
                    }

                    // 上下文长度过滤
                    let matchesContext = true;
                    if (contextFilter) {
                        const contextLength = model.context_length || 0;
                        switch (contextFilter) {
                            case 'short':
                                matchesContext = contextLength < 10000;
                                break;
                            case 'medium':
                                matchesContext = contextLength >= 10000 && contextLength < 50000;
                                break;
                            case 'long':
                                matchesContext = contextLength >= 50000 && contextLength <= 200000;
                                break;
                            case 'extra_long':
                                matchesContext = contextLength > 200000;
                                break;
                        }
                    }

                    // 输入/输出模态过滤
                    const inputs = (model.architecture?.input_modalities || []).map(mod => this.normalizeModality(mod));
                    const outputs = (model.architecture?.output_modalities || []).map(mod => this.normalizeModality(mod));
                    const matchesInputModality = !inputModalityFilter || inputs.includes(inputModalityFilter);
                    const matchesOutputModality = !outputModalityFilter || outputs.includes(outputModalityFilter);

                    return matchesSearch && matchesPrice && matchesContext && matchesInputModality && matchesOutputModality;
                });

                this.renderTable();
                this.updateStats();
                this.renderSearchResults(searchTerm);
            }

            sort(column) {
                if (this.sortColumn === column) {
                    this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    this.sortColumn = column;
                    this.sortDirection = 'asc';
                }

                this.filteredModels.sort((a, b) => {
                    let aVal, bVal;

                    switch (column) {
                        case 'name':
                            aVal = a.name || '';
                            bVal = b.name || '';
                            break;
                        case 'pricing':
                            aVal = parseFloat(a.pricing?.prompt || 0);
                            bVal = parseFloat(b.pricing?.prompt || 0);
                            break;
                        case 'context_length':
                            aVal = a.context_length || 0;
                            bVal = b.context_length || 0;
                            break;
                        case 'created':
                            aVal = a.created || 0;
                            bVal = b.created || 0;
                            break;
                        default:
                            return 0;
                    }

                    if (typeof aVal === 'string') {
                        const result = aVal.localeCompare(bVal);
                        return this.sortDirection === 'asc' ? result : -result;
                    } else {
                        const result = aVal - bVal;
                        return this.sortDirection === 'asc' ? result : -result;
                    }
                });

                this.updateSortHeaders();
                this.renderTable();
            }

            updateSortHeaders() {
                document.querySelectorAll('th.sortable').forEach(th => {
                    th.classList.remove('sort-asc', 'sort-desc');
                    if (th.dataset.column === this.sortColumn) {
                        th.classList.add(`sort-${this.sortDirection}`);
                    }
                });
            }

            renderTable() {
                const tbody = document.getElementById('modelsBody');
                tbody.innerHTML = '';

                const inCompareMode = this.compareMode && this.selectedModelIds.size > 0;
                const displayModels = inCompareMode
                    ? this.models.filter(m => this.selectedModelIds.has(this.getModelId(m)))
                    : this.filteredModels;

                displayModels.forEach(model => {
                    const row = document.createElement('tr');
                    const modelId = this.getModelId(model);
                    row.dataset.modelId = modelId;
                    if (this.selectedModelIds.has(modelId)) {
                        row.classList.add('selected-row');
                    }

                    // 模型名称
                    const nameCell = document.createElement('td');
                    nameCell.className = 'model-name';

                    // 在对比模式下添加删除按钮
                    if (inCompareMode) {
                        const nameContainer = document.createElement('div');
                        nameContainer.style.display = 'flex';
                        nameContainer.style.alignItems = 'center';
                        nameContainer.style.justifyContent = 'space-between';
                        nameContainer.style.gap = '8px';

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'cell-text';
                        nameSpan.textContent = model.name || model.id;
                        nameSpan.style.flex = '1';
                        nameContainer.appendChild(nameSpan);

                        const deleteButton = document.createElement('button');
                        deleteButton.type = 'button';
                        deleteButton.className = 'delete-button';
                        deleteButton.innerHTML = '×';
                        deleteButton.style.width = '20px';
                        deleteButton.style.height = '20px';
                        deleteButton.style.borderRadius = '50%';
                        deleteButton.style.border = '1px solid #d0d7de';
                        deleteButton.style.backgroundColor = '#fff';
                        deleteButton.style.color = '#cf222e';
                        deleteButton.style.fontSize = '14px';
                        deleteButton.style.fontWeight = 'bold';
                        deleteButton.style.cursor = 'pointer';
                        deleteButton.style.display = 'flex';
                        deleteButton.style.alignItems = 'center';
                        deleteButton.style.justifyContent = 'center';
                        deleteButton.style.transition = 'all 0.2s ease';
                        deleteButton.setAttribute('aria-label', `删除 ${model.name || model.id}`);
                        deleteButton.title = `删除 ${model.name || model.id}`;

                        deleteButton.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.removeFromCompare(modelId);
                        });

                        deleteButton.addEventListener('mouseenter', () => {
                            deleteButton.style.backgroundColor = '#ffebe9';
                            deleteButton.style.borderColor = '#cf222e';
                        });

                        deleteButton.addEventListener('mouseleave', () => {
                            deleteButton.style.backgroundColor = '#fff';
                            deleteButton.style.borderColor = '#d0d7de';
                        });

                        nameContainer.appendChild(deleteButton);
                        nameCell.appendChild(nameContainer);
                    } else {
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'cell-text';
                        nameSpan.textContent = model.name || model.id;
                        nameCell.appendChild(nameSpan);
                    }

                    nameCell.dataset.visible = 'col-name';
                    row.appendChild(nameCell);

                    // 描述
                    const descCell = document.createElement('td');
                    descCell.className = 'model-description';
                    const descText = model.description || '-';
                    const descSpan = document.createElement('span');
                    descSpan.className = 'cell-text';
                    descSpan.textContent = descText;
                    descCell.appendChild(descSpan);
                    descCell.title = model.description || '';
                    descCell.dataset.visible = 'col-description';
                    row.appendChild(descCell);

                    // 价格
                    const priceCell = document.createElement('td');
                    priceCell.className = 'price';
                    const promptPrice = model.pricing?.prompt || '0';
                    const completionPrice = model.pricing?.completion || '0';
                    const formattedPromptPrice = this.formatPrice(promptPrice);
                    const formattedCompletionPrice = this.formatPrice(completionPrice);
                    const priceSpan = document.createElement('span');
                    priceSpan.className = 'cell-text';
                    priceSpan.textContent = `${formattedPromptPrice} / ${formattedCompletionPrice}`;
                    priceCell.appendChild(priceSpan);
                    priceCell.dataset.visible = 'col-pricing';
                    row.appendChild(priceCell);

                    // 上下文长度
                    const contextCell = document.createElement('td');
                    contextCell.className = 'context-length';
                    const contextSpan = document.createElement('span');
                    contextSpan.className = 'cell-text';
                    contextSpan.textContent = this.formatContextLength(model.context_length);
                    contextCell.appendChild(contextSpan);
                    contextCell.dataset.visible = 'col-context';
                    row.appendChild(contextCell);

                    // 供应商信息
                    const providerCell = document.createElement('td');
                    providerCell.className = 'provider-info';
                    let providerText = '-';
                    if (model.top_provider) {
                        const maxCompletionText = (this.i18n && typeof this.i18n.t === 'function')
                            ? this.i18n.t('max_completion')
                            : '最大完成';
                        providerText = `${maxCompletionText}: ${model.top_provider.max_completion_tokens || '-'}`;
                        if (model.top_provider.is_moderated) {
                            const moderatedText = (this.i18n && typeof this.i18n.t === 'function')
                                ? this.i18n.t('moderated')
                                : '受审查';
                            providerText += `<span class="moderated">${moderatedText}</span>`;
                        }
                    }
                    const providerSpan = document.createElement('div');
                    providerSpan.className = 'cell-html';
                    providerSpan.innerHTML = providerText;
                    providerCell.appendChild(providerSpan);
                    providerCell.title = providerSpan.textContent || providerText;
                    providerCell.dataset.visible = 'col-provider';
                    row.appendChild(providerCell);

                    // 输入/输出模态
                    const modalityCell = document.createElement('td');
                    const inputModalities = model.architecture?.input_modalities || [];
                    const outputModalities = model.architecture?.output_modalities || [];
                    const inputLabel = (this.i18n && typeof this.i18n.t === 'function') ? this.i18n.t('input') : '输入';
                    const outputLabel = (this.i18n && typeof this.i18n.t === 'function') ? this.i18n.t('output') : '输出';
                    const inputText = inputModalities.length ? inputModalities.join(', ') : '-';
                    const outputText = outputModalities.length ? outputModalities.join(', ') : '-';
                    const modalityText = `${inputLabel}: ${inputText} | ${outputLabel}: ${outputText}`;
                    const modalitySpan = document.createElement('span');
                    modalitySpan.className = 'cell-text';
                    modalitySpan.textContent = modalityText;
                    modalityCell.appendChild(modalitySpan);
                    modalityCell.title = modalityText;
                    modalityCell.dataset.visible = 'col-modalities';
                    row.appendChild(modalityCell);

                    // Tokenizer
                    const tokenizerCell = document.createElement('td');
                    const tokenizerSpan = document.createElement('span');
                    tokenizerSpan.className = 'cell-text';
                    tokenizerSpan.textContent = model.architecture?.tokenizer || '-';
                    tokenizerCell.appendChild(tokenizerSpan);
                    tokenizerCell.dataset.visible = 'col-tokenizer';
                    row.appendChild(tokenizerCell);

                    // 创建时间
                    const createdCell = document.createElement('td');
                    const createdSpan = document.createElement('span');
                    createdSpan.className = 'cell-text';
                    if (model.created) {
                        const date = new Date(model.created * 1000);
                        createdSpan.textContent = date.toLocaleDateString('zh-CN');
                    } else {
                        createdSpan.textContent = '-';
                    }
                    createdCell.appendChild(createdSpan);
                    createdCell.dataset.visible = 'col-created';
                    row.appendChild(createdCell);

                    // 添加点击事件来显示原始JSON
                    row.addEventListener('click', () => {
                        this.showModelJson(model);
                    });

                    tbody.appendChild(row);
                });

                this.updateColumnVisibility();

                // 检查表格是否可滚动并添加指示器
                this.updateScrollIndicator();
            }

            updateScrollIndicator() {
                const tableWrapper = document.querySelector('.table-wrapper');
                const table = document.getElementById('modelsTable');

                if (!tableWrapper || !table || table.style.display === 'none') return;

                // 检查表格是否溢出容器
                const isScrollable = table.scrollWidth > tableWrapper.clientWidth;

                if (isScrollable) {
                    tableWrapper.classList.add('scrollable');
                } else {
                    tableWrapper.classList.remove('scrollable');
                }
            }

            toggleColumn(columnId, visible) {
                const columnName = columnId.replace('col-', '');
                document.querySelectorAll(`[data-visible="${columnId}"]`).forEach(el => {
                    el.style.display = visible ? '' : 'none';
                });
            }

            updateColumnVisibility() {
                document.querySelectorAll('.column-option input').forEach(checkbox => {
                    this.toggleColumn(checkbox.id, checkbox.checked);
                });
            }

            saveColumnSettings() {
                const settings = {};
                document.querySelectorAll('.column-option input').forEach(checkbox => {
                    settings[checkbox.id] = checkbox.checked;
                });
                localStorage.setItem('openrouter-column-settings', JSON.stringify(settings));
            }

            loadColumnSettings() {
                try {
                    const settings = JSON.parse(localStorage.getItem('openrouter-column-settings') || '{}');
                    document.querySelectorAll('.column-option input').forEach(checkbox => {
                        if (settings.hasOwnProperty(checkbox.id)) {
                            checkbox.checked = settings[checkbox.id];
                        }
                    });
                } catch (error) {
                    console.warn('Failed to load column settings:', error);
                }
            }

            extractModalityOptions() {
                const inputSet = new Set();
                const outputSet = new Set();

                this.models.forEach(model => {
                    (model.architecture?.input_modalities || []).forEach(mod => {
                        const normalized = this.normalizeModality(mod);
                        const raw = (mod || '').toString();
                        if (normalized) {
                            inputSet.add(raw.trim());
                        }
                    });

                    (model.architecture?.output_modalities || []).forEach(mod => {
                        const normalized = this.normalizeModality(mod);
                        const raw = (mod || '').toString();
                        if (normalized) {
                            outputSet.add(raw.trim());
                        }
                    });
                });

                this.inputModalities = Array.from(inputSet).sort();
                this.outputModalities = Array.from(outputSet).sort();
            }

            renderModalityFilters() {
                const allText = (this.i18n && typeof this.i18n.t === 'function')
                    ? this.i18n.t('all')
                    : '全部';

                const inputSelect = document.getElementById('inputModalityFilter');
                if (inputSelect) {
                    const currentValue = inputSelect.value;
                    inputSelect.innerHTML = '';
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = allText;
                    inputSelect.appendChild(defaultOption);

                    this.inputModalities.forEach(mod => {
                        const option = document.createElement('option');
                        option.value = this.normalizeModality(mod);
                        option.textContent = mod;
                        inputSelect.appendChild(option);
                    });

                    if (currentValue && this.inputModalities.some(mod => this.normalizeModality(mod) === currentValue)) {
                        inputSelect.value = currentValue;
                    }
                }

                const outputSelect = document.getElementById('outputModalityFilter');
                if (outputSelect) {
                    const currentValue = outputSelect.value;
                    outputSelect.innerHTML = '';
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = allText;
                    outputSelect.appendChild(defaultOption);

                    this.outputModalities.forEach(mod => {
                        const option = document.createElement('option');
                        option.value = this.normalizeModality(mod);
                        option.textContent = mod;
                        outputSelect.appendChild(option);
                    });

                    if (currentValue && this.outputModalities.some(mod => this.normalizeModality(mod) === currentValue)) {
                        outputSelect.value = currentValue;
                    }
                }
            }

            updateStats() {
                const total = this.models.length;
                const filtered = this.filteredModels.length;
                const totalEl = document.getElementById('totalModels');
                const filteredEl = document.getElementById('filteredModels');
                if (totalEl) totalEl.textContent = total;
                if (filteredEl) filteredEl.textContent = filtered;

                const filteredMeta = document.getElementById('filteredMeta');
                if (filteredMeta) filteredMeta.textContent = filtered;

                const filteredMetaDialog = document.getElementById('filteredMetaDialog');
                if (filteredMetaDialog) filteredMetaDialog.textContent = filtered;

                const toolbarCount = document.getElementById('toolbarCount');
                if (toolbarCount) toolbarCount.textContent = filtered;
            }

            showError(message) {
                document.getElementById('loading').style.display = 'none';
                const errorEl = document.getElementById('error');
                const errorPrefix = (this.i18n && typeof this.i18n.t === 'function')
                    ? this.i18n.t('load_failed')
                    : '加载数据失败';
                errorEl.textContent = errorPrefix + ': ' + message;
                errorEl.style.display = 'block';
            }

            formatContextLength(contextLength) {
                if (!contextLength || contextLength === 0) {
                    return '-';
                }

                if (contextLength >= 1000000) {
                    return (contextLength / 1000000).toFixed(1) + 'M';
                } else if (contextLength >= 1000) {
                    return (contextLength / 1000).toFixed(1) + 'K';
                } else {
                    return contextLength.toString();
                }
            }

            formatPrice(price) {
                const numPrice = parseFloat(price || 0);
                if (numPrice === 0) {
                    return (this.i18n && typeof this.i18n.t === 'function')
                        ? this.i18n.t('free')
                        : '免费';
                }
                // 转换为每百万tokens的价格
                const pricePerMillion = numPrice * 1000000;
                return `$${pricePerMillion.toFixed(2)}`;
            }

            normalizeModality(modality) {
                return (modality || '').toString().trim().toLowerCase();
            }

            getModelId(model) {
                return model.id || model.name || model.slug || '';
            }

            addToCompare(modelId) {
                if (!modelId) return;
                this.selectedModelIds.add(modelId);
                this.updateCompareState();
                this.renderTable();
                this.renderSearchResults(this.getSearchTerm());
            }

            removeFromCompare(modelId) {
                if (!modelId) return;
                this.selectedModelIds.delete(modelId);
                this.updateCompareState();
                this.renderTable();
                this.renderSearchResults(this.getSearchTerm());
            }

            updateCompareState() {
                this.compareMode = this.selectedModelIds.size > 0;
            }

            renderSearchResults(searchTerm) {
                const container = document.getElementById('searchResults');
                if (!container) return;
                container.innerHTML = '';

                if (!searchTerm) {
                    container.style.display = 'none';
                    return;
                }

                // 从所有模型中搜索匹配项，不依赖当前筛选结果
                const allMatches = this.models.filter(model => {
                    const modelName = (model.name || model.id || '').toLowerCase();
                    const description = (model.description || '').toLowerCase();
                    return modelName.includes(searchTerm) || description.includes(searchTerm);
                });

                const matches = allMatches.slice(0, 10);
                matches.forEach(model => {
                    const modelId = this.getModelId(model);
                    const item = document.createElement('div');
                    item.className = 'search-result-item';

                    const name = document.createElement('div');
                    name.className = 'search-result-name';
                    name.textContent = model.name || modelId;
                    item.appendChild(name);

                    const actionButton = document.createElement('button');
                    actionButton.type = 'button';
                    const inSelected = this.selectedModelIds.has(modelId);
                    if (inSelected) {
                        actionButton.className = 'clear-button';
                        actionButton.textContent = (this.i18n && typeof this.i18n.t === 'function')
                            ? this.i18n.t('remove') || '删除'
                            : '删除';
                        actionButton.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.removeFromCompare(modelId);
                        });
                    } else {
                        actionButton.className = 'compare-button';
                        actionButton.textContent = (this.i18n && typeof this.i18n.t === 'function')
                            ? this.i18n.t('compare')
                            : 'Compare';
                        actionButton.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.addToCompare(modelId);
                        });
                    }

                    item.appendChild(actionButton);
                    item.addEventListener('click', () => {
                        this.showModelJson(model);
                    });

                    container.appendChild(item);
                });

                container.style.display = matches.length ? 'block' : 'none';
            }

            setupResponsiveCollapse() {
                const handleResize = () => {
                    const isNarrowScreen = window.innerWidth <= 640;
                    const shouldCollapseView = isNarrowScreen;
                    const shouldCollapseFilters = isNarrowScreen;

                    // 只有在屏幕宽度跨越边界时才改变状态
                    if (this.viewCollapsed !== shouldCollapseView) {
                        this.viewCollapsed = shouldCollapseView;
                        this.applyViewState();
                    }

                    if (this.filtersCollapsed !== shouldCollapseFilters) {
                        this.filtersCollapsed = shouldCollapseFilters;
                        this.applyFiltersState();
                    }
                };

                // 防抖处理，避免频繁触发
                let resizeTimeout;
                const debouncedResize = () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        handleResize();
                        this.updateScrollIndicator();
                    }, 150);
                };

                window.addEventListener('resize', debouncedResize);
            }

            applyViewState() {
                const card = document.getElementById('viewCard');
                const toggle = document.getElementById('viewToggle');
                const body = document.getElementById('viewBody');
                if (!card || !toggle || !body) return;

                const collapsed = this.viewCollapsed;
                card.classList.toggle('collapsed', collapsed);
                toggle.setAttribute('aria-expanded', String(!collapsed));
                const icon = toggle.querySelector('.chevron-icon');
                if (icon) {
                    icon.classList.toggle('chevron-right', collapsed);
                }

                if (collapsed) {
                    body.style.maxHeight = '0px';
                    body.style.opacity = '0';
                } else {
                    // 确保内容可见时能正确计算高度
                    body.style.maxHeight = 'none';
                    const height = body.scrollHeight;
                    body.style.maxHeight = '0px';
                    // 使用requestAnimationFrame确保动画流畅
                    requestAnimationFrame(() => {
                        body.style.maxHeight = `${height}px`;
                        body.style.opacity = '1';
                    });
                }
            }

            applyFiltersState() {
                const controls = document.getElementById('controlsCard');
                const toggle = document.getElementById('filtersToggle');
                const body = document.getElementById('filtersBody');
                if (!controls || !toggle || !body) return;

                const collapsed = this.filtersCollapsed;
                controls.classList.toggle('collapsed', collapsed);
                toggle.setAttribute('aria-expanded', String(!collapsed));
                const icon = toggle.querySelector('.chevron-icon');
                if (icon) {
                    icon.classList.toggle('chevron-right', collapsed);
                }

                if (collapsed) {
                    body.style.maxHeight = '0px';
                    body.style.opacity = '0';
                } else {
                    // 确保内容可见时能正确计算高度
                    body.style.maxHeight = 'none';
                    const height = body.scrollHeight;
                    body.style.maxHeight = '0px';
                    // 使用requestAnimationFrame确保动画流畅
                    requestAnimationFrame(() => {
                        body.style.maxHeight = `${height}px`;
                        body.style.opacity = '1';
                    });
                }
            }

          getSearchTerm() {
                const input = document.getElementById('searchInput');
                return (input?.value || '').toLowerCase();
            }

            showModelJson(model) {
                const modal = document.getElementById('jsonModal');
                const modelName = document.getElementById('jsonModalTitle');
                const jsonContent = document.getElementById('jsonContent');

                modelName.textContent = model.name || model.id;
                jsonContent.textContent = JSON.stringify(model, null, 2);
                modal.style.display = 'block';

                // 阻止事件冒泡
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        this.hideModelJson();
                    }
                });
            }

            hideModelJson() {
                const modal = document.getElementById('jsonModal');
                modal.style.display = 'none';
            }

            showInfoDialog() {
                const dialog = document.getElementById('infoDialog');
                if (dialog) {
                    dialog.style.display = 'block';
                    // 触发动画
                    setTimeout(() => {
                        dialog.classList.add('show');
                    }, 10);

                    // 防止背景滚动
                    document.body.style.overflow = 'hidden';
                }
            }

            hideInfoDialog() {
                const dialog = document.getElementById('infoDialog');
                if (dialog) {
                    dialog.classList.remove('show');
                    setTimeout(() => {
                        dialog.style.display = 'none';
                        // 恢复背景滚动
                        document.body.style.overflow = '';
                    }, 300);
                }
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing...');
            try {
                // 初始化粒子系统
                document.particleSystem = new ParticleSystem('html-root');
                console.log('ParticleSystem initialized successfully');

                // 初始化主应用
                document.modelsManager = new ModelsManager();
                console.log('ModelsManager initialized successfully');
            } catch (error) {
                console.error('Failed to initialize application:', error);
            }
        });

        // ESC键关闭模态框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.modelsManager) {
                document.modelsManager.hideModelJson();
                document.modelsManager.hideInfoDialog();
            }
        });

        // 添加全局错误处理
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
        });
    </script>
</body>

</html>
